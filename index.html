<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Koshimizu Haruto</title>
  <meta name="description" content="輿水遥人（Koshimizu Haruto）のポートフォリオ。愛知工業大学 情報科学部 情報科学科 コンピュータシステム専攻。">
  <meta property="og:title" content="Koshimizu Haruto">
  <meta property="og:description" content="輿水遥人のポートフォリオ">
  <style>
    :root {
      --bg: #232427;
      --text: #f2f2f0;
      --muted: #a3a39f;
      --line: #3b3c40;
      --hover: #fff;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Helvetica Neue", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
      line-height: 1.85;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--text); text-decoration-color: var(--muted); text-underline-offset: 4px; }
    a:hover { color: var(--hover); text-decoration-color: var(--hover); }
    a:focus-visible { outline: 2px solid var(--text); outline-offset: 4px; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 0 28px; }

    /* ヘッダー：名前を大きく見せる */
    header { padding: clamp(72px, 16vh, 160px) 0 56px; }
    header h1 {
      margin: 0;
      font-size: clamp(2.8rem, 11vw, 6.5rem);
      font-weight: 700;
      line-height: 1.02;
      letter-spacing: -0.035em;
    }
    .ja { margin: 20px 0 0; font-size: 1.15rem; letter-spacing: 0.12em; }
    .affil { margin: 4px 0 0; color: var(--muted); }

    /* 各セクション：左に見出し、右に内容 */
    section {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 12px 32px;
      padding: 40px 0;
      border-top: 1px solid var(--line);
    }
    section h2 { margin: 0; font-size: 0.95rem; font-weight: 500; color: var(--muted); }
    section p { margin: 0 0 12px; }
    section p:last-child { margin-bottom: 0; }

    .works { list-style: none; padding: 0; margin: 0; }
    .works li + li { margin-top: 28px; }
    .works h3 { margin: 0; font-size: 1.2rem; font-weight: 600; line-height: 1.5; }
    .works p { margin: 4px 0 0; color: var(--muted); }

    footer { padding: 32px 0 72px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.85rem; }

    @media (max-width: 640px) {
      section { grid-template-columns: 1fr; padding: 32px 0; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>Koshimizu<br>Haruto</h1>
      <p class="ja">輿水遥人</p>
      <p class="affil">愛知工業大学 情報科学部 情報科学科 コンピュータシステム専攻</p>
    </div>
  </header>

  <main class="wrap">
    <section id="works">
      <h2>制作物</h2>
      <ul class="works">
        <li>
          <h3><!-- 公開リポジトリができたら下の行に差し替え：<a href="https://github.com/Haruto-Koshimizu/リポジトリ名">うどん作り体験ゲーム「踏みすぎて麺！」</a> -->うどん作り体験ゲーム「踏みすぎて麺！」</h3>
          <p>TGS2026プロジェクト</p>
        </li>
      </ul>
    </section>

    <section id="skills">
      <h2>スキル</h2>
      <p>Unity / Git / GitHub / Javascript / HTML / CSS / Java</p>
    </section>

    <section id="contact">
      <h2>リンク</h2>
      <p><a href="https://github.com/Haruto-Koshimizu">GitHub</a></p>
      <p><a href="ko.haru414@icloud.com">メール</a></p>
      <p><a href="k24062kk@aitech.ac.jp">大学メール</a></p>
    </section>
  </main>

  <footer>
    <div class="wrap">&copy; 2026 Koshimizu Haruto</div>
  </footer>
</body>
</html>
